[project]
name = "systems-handbook"
version = "0.2"
description = "Loyola University Chicago CS Systems Handbook"
authors = [{ name = "Nicholas M. Synovic", email = "nicholas.synovic@gmail.com" }]
requires-python = ">=3.13,<4.0"
readme = "README.md"
keywords = ["Sphinx Site", "Loyola University Chicago"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "sphinx>=8.2.1,<9",
    "sphinx-book-theme>=1.4.0",
    "myst-parser>=5.2.0",
]

[project.urls]
Homepage = "https://systemshandbook.cs.luc.edu/"
Repository = "https://github.com/LoyolaChicagoBooks/systems-handbook-hugo"

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
